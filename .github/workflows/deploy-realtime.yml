name: Deploy Realtime

# The realtime race server runs on Render (velokey.onrender.com), not PartyKit
# Cloud. Trigger a Render deploy when server code changes by adding the
# service's Deploy Hook URL as the RENDER_DEPLOY_HOOK_URL repository secret
# (Render dashboard → service → Settings → Deploy Hook).
#
# PartyKit Cloud deploys are intentionally not used: the partykit.dev zone hit
# Cloudflare's 10k custom-domain limit (partykit/partykit#985) and the managed
# platform rejects all new deploys until that is resolved.
#
# Two implementation notes, both learned the hard way:
#   1. The `secrets` context is NOT available in `if` expressions. Referencing
#      it there made this workflow fail to parse on every push (0s, "workflow
#      file issue"). The secret is mapped to job-level `env` and the step is
#      gated on `env` instead, which is allowed.
#   2. No typecheck here: `ci.yml` already typechecks every push to main, and
#      these jobs run in parallel, so a local typecheck would not gate the
#      deploy anyway. Render runs its own build and fails it if types break.
#
# Resulting state: if the secret is unset the job reports "skipped" rather
# than failing, which is the graceful behaviour the header describes.

on:
  push:
    branches: [main]
    paths:
      - "realtime/**"
      - "shared/**"
      - "partykit.json"
      - ".github/workflows/deploy-realtime.yml"
  workflow_dispatch:

concurrency:
  group: deploy-realtime
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Report skipped deploy
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::notice::RENDER_DEPLOY_HOOK_URL is not set - skipping realtime deploy."

      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Render deploy triggered"
