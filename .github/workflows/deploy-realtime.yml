name: Deploy Realtime

# The realtime race server runs on Render (velokey.onrender.com), not PartyKit
# Cloud. Trigger a Render deploy when server code changes by adding the
# service's Deploy Hook URL as the RENDER_DEPLOY_HOOK_URL repository secret
# (Render dashboard → service → Settings → Deploy Hook).
#
# PartyKit Cloud deploys are intentionally not used: the partykit.dev zone hit
# Cloudflare's 10k custom-domain limit (partykit/partykit#985) and the managed
# platform rejects all new deploys until that is resolved.

on:
  push:
    branches: [main]
    paths:
      - "realtime/**"
      - "shared/**"
      - "partykit.json"
      - ".github/workflows/deploy-realtime.yml"
  workflow_dispatch:

concurrency:
  group: deploy-realtime
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{}' && echo "Render deploy triggered"
